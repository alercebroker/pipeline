hydra:
  run:
    dir: .
  output_subdir: null 

stamp_classifier:
  results_dir: results_rubin_real_trainSN_valSN_synthetic_eval_firstStamp_v1
  exp_description: rubin_gridsearch_quick
  load_pretrained_model: false
  checkpoint:
    exp_name: classification/ztf/testing
    run_name: 2025-09-25_13-18-27
    results_dir: results_ztf
  model_name: stamp_full
  name_dataset_version: rubin_real
  dir_data: ./../../../data_acquisition/rubin/data/processed/ts_stamps_v0.0.2_comm_4candmax
  path_partition: ./../../../data_acquisition/rubin/data/processed/partitions/partitions_trainSN_valSN_synthetic_eval_firstStamp_v1/partitions.parquet
  debug: false
  is_searching_hyperparameters: true
  simulated_data: {
    use: true,
    path: './../../../data_acquisition/rubin/data/simulated_data/synthetic_total_SN.pkl'
    }
  list_folds: [0, 1, 2, 3, 4]
  loader:
    id_col: oid
    candid_col: measurement_id
    ra_col: ra
    dec_col: dec
    class_col: class
    stamps_cols:
    - flux_Science_data
    - flux_Difference_data
    - flux_Template_data
    cropping:
      use: false
      crop_size: 21
    num_workers: 12
    coord_type: spherical
    norm_type: z-score
    batch_size: 256
    use_coords: false
  arch:
    conv_config:
    - filters: 8
      kernel_size:
      - 2
      - 2
      activation: relu
      pool: true
      pool_size:
      - 2
      - 2
    - filters: 16
      kernel_size:
      - 2
      - 2
      activation: relu
      pool: true
      pool_size:
      - 2
      - 2
    - filters: 32
      kernel_size:
      - 2
      - 2
      activation: relu
      pool: true
      pool_size:
      - 2
      - 2
    dense_config:
    - units: 16
      activation: tanh
    dropout_rate: 0.4
    use_batchnorm_metadata: false
    use_metadata: false
  training:
    lr: 0.0007
    use_focal: false
    patience: 10
    num_epochs: 10000
    monitor: loss
    eval_train_at_the_epoch_end: true
