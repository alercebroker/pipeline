user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile       on;
    tcp_nopush     on;
    tcp_nodelay    on;
    keepalive_timeout 65;

    # Cache file descriptors and stat() results — reduces repeated syscalls
    # for the large .avro files served directly from disk.
    open_file_cache          max=50000 inactive=120s;
    open_file_cache_valid    60s;
    open_file_cache_min_uses 1;
    open_file_cache_errors   on;

    server {
        listen 80;
        server_name _;

        # IP filtering is done entirely by ufw on the host.
        # Anything that reaches nginx is already allowed.
        root /data-v11;

        # .avro files are immutable once written.
        # Serve them directly from disk — FastAPI is not involved.
        # Try v11 first, fall back to v10.
        location ~* \.avro$ {
            root /data-v11;
            add_header Cache-Control "public, max-age=3600, immutable";
            try_files $uri @avro_v10;
        }
        location @avro_v10 {
            root /data-v10;
            add_header Cache-Control "public, max-age=3600, immutable";
            try_files $uri =404;
        }

        # index.txt files are plain-text file lists used by client scripts.
        # Serve directly; short cache because the writer appends to them live.
        # Try v11 first, fall back to v10.
        location ~* /.+/index\.txt$ {
            root /data-v11;
            add_header Cache-Control "public, max-age=60";
            add_header Content-Type "text/plain; charset=utf-8";
            try_files $uri @index_v10;
        }
        location @index_v10 {
            root /data-v10;
            add_header Cache-Control "public, max-age=60";
            add_header Content-Type "text/plain; charset=utf-8";
            try_files $uri =404;
        }

        # Everything else (UI, search, pagination) goes to the FastAPI app.
        location / {
            proxy_pass         http://web:8000;
            proxy_set_header   Host $http_host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }
    }
}
