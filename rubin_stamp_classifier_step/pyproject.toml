[tool.poetry]
name = "rubin-stamp-classifier-step"
version = "0.1.1"
description = ""
authors = ["Francisco Andrades", "Daniel Moreno", "Alejandra Muñoz-Arancibia", "Ignacio Reyes-Jainaga"]
readme = "README.md"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
step = { callable = "scripts.run_step:step" }

[tool.poetry.dependencies]
python = ">=3.10,<3.12"
pandas = ">=2.2.0,<2.3.0"
numpy = ">=1.26.0,<2.0.0"
apf-base = { path = "../libs/apf", develop = true }
db-plugins =  { path = "../libs/db-plugins-multisurvey", develop = true }
numexpr = "^2.8.8"
astropy = "~=6.1"
avro = "^1.12.0"
# Base classes only; each model's runtime (tensorflow or torch) comes from its group below.
alerce_classifiers = { path = "../alerce_classifiers", develop = true }
psycopg2-binary = ">=2.9.6,<3.0.0"
wget = "^3.2"

[tool.poetry.group.dev.dependencies]
black = "~=23.0"
pytest = "^7.4.0"
pytest-docker = "^1.0.1"
pytest-cov = "^4.1.0"

# One optional group per model. The image installs exactly one of them
# (Dockerfile ARG model), so the rubin image carries no torch and the hunter
# image no tensorflow.
[tool.poetry.group.rubin]
optional = true

[tool.poetry.group.hunter]
optional = true

[tool.poetry.group.rubin.dependencies]
alerce_classifiers = { path = "../alerce_classifiers", develop = true, extras = ["rubin"] }

[tool.poetry.group.hunter.dependencies]
alerce_classifiers = { path = "../alerce_classifiers", develop = true, extras = ["hunter"] }
# The pods run on CPU: on Linux take torch from the PyTorch CPU index (the
# PyPI wheel drags in the nvidia CUDA packages). macOS wheels are CPU-only
# and only exist on PyPI.
torch = [
    { version = "2.14.0", source = "pytorch-cpu", markers = "sys_platform == 'linux'" },
    { version = "2.14.0", markers = "sys_platform == 'darwin'" },
]

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"
