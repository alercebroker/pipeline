# Default values for step_starter.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

namespace: lc-classifier-step

image:
  repository: ghcr.io/alercebroker/rubin_stamp_classifier_step
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets:
  - name: "image-pull-access"
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}

resources: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 32
  targetCPUUtilizationPercentage: 80

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: nodegroup
              operator: In
              ## Override this value with the NodeGroup tag accordingly
              values: []

configYaml:
  LOGGING_LEVEL: INFO
  CONSUMER_CONFIG:
    CLASS: "apf.consumers.KafkaConsumer"
    TOPICS: ["lsst"]
    PARAMS:
      bootstrap.servers: ""
      group.id: ""
      auto.offset.reset: "beginning"
      enable.partition.eof: false
      security.protocol: ""
      sasl.mechanism: "SCRAM-SHA-512"
      sasl.username: ""
      sasl.password: ""
    consume.timeout: 10
    consume.messages: 100
  PRODUCER_CONFIG:
    PARAMS:
      bootstrap.servers: ""
      security.protocol: ""
      sasl.mechanism: "SCRAM-SHA-512"
      sasl.username: ""
      sasl.password: ""
    CLASS: "apf.producers.kafka.KafkaProducer"
    SCHEMA_PATH: "/schemas/rubin_stamp_classifier_step/output.avsc"
  METRICS_CONFIG:
    CLASS: "apf.metrics.KafkaMetricsProducer"
    PARAMS:
      PARAMS:
        bootstrap.servers: ""
        security.protocol: ""
        sasl.mechanism: "SCRAM-SHA-512"
        sasl.username: ""
        sasl.password: ""
      TOPIC: "metrics"
      SCHEMA_PATH: "/schemas/rubin_stamp_classifier_step/metrics.json"
  SCRIBE_PRODUCER_CONFIG:
    CLASS: "apf.producers.KafkaProducer"
    PARAMS:
      bootstrap.servers: ""
      security.protocol: ""
      sasl.mechanism: "SCRAM-SHA-512"
      sasl.username: ""
      sasl.password: ""
    TOPIC: "w_object"
    SCHEMA_PATH: "/schemas/scribe_step/scribe.avsc"
  # Rubin deployment only: forward the raw LSST alert of every ranking-1
  # SN_FORWARD_CLASS object to the topic the hunter deployment consumes.
  # Schemaless records, like every multisurvey topic: the hunter deployment
  # consumes with apf.consumers.KafkaSchemalessConsumer and this SCHEMA_PATH.
  # The hunter deployment disables it with `SN_FORWARD_PRODUCER_CONFIG: null`
  # (Helm merges maps, so `{}` would not remove the block).
  SN_FORWARD_CLASS: "SN"
  SN_FORWARD_PRODUCER_CONFIG:
    CLASS: "apf.producers.kafka.KafkaSchemalessProducer"
    PARAMS:
      bootstrap.servers: ""
      security.protocol: ""
      sasl.mechanism: "SCRAM-SHA-512"
      sasl.username: ""
      sasl.password: ""
    TOPIC: "sn_candidates"
    SCHEMA_PATH: "/schemas/surveys/lsst_v11.1/lsst.v11_1.alert.avsc"
  MODEL_VERSION: ""
  MODEL_CONFIG:
    # rubin: alerce_classifiers.rubin.StampClassifierModel
    # hunter: alerce_classifiers.hunter.HunterStampClassifierModel
    CLASS: ""
    PARAMS:
      model_path: ""
    CLS_ID: ""
  PYROSCOPE_SERVER: "http://pyroscope.pyroscope:4040"
  SCRIBE_PARSER_CLASS: "lc_classification.core.parsers.scribe_parser.ScribeParser"
  STEP_PARSER_CLASS: "lc_classification.core.parsers.elasticc_parser.ElasticcParser"
  FEATURE_FLAGS:
    USE_PROFILING: true
    PROMETHEUS: false

imageCredentials:
  registry: ""
  username: ""
  password: ""
  email: ""

envVariables:
  - name: CONFIG_YAML_PATH
    value: "/config/config.yaml"