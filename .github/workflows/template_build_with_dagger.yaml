name: Build_with dagger template
on:
  workflow_call:
    inputs:
      stage:
        required: true
        type: string
        default: "staging"
      extra-args:
        required: false
        type: string
        default: ""
      submodules:
        required: false
        type: boolean
        default: false
      ref:
        required: false
        type: string
        default: "main"
    secrets:
      GH_TOKEN:
        required: true
      PYPI_TOKEN:
        required: false

jobs:
  build-package:
    # Pinned: on ubuntu-latest = ubuntu-26.04 the dagger 0.8.8 engine hangs at
    # "starting engine".
    runs-on: ubuntu-24.04
    env:
      GHCR_TOKEN: ${{ secrets.GH_TOKEN }}
      PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
    steps:
      # maximize-build-space joins / and the /mnt temp disk into one volume.
      # Current GitHub runners (24.04 and 26.04) have no separate /mnt disk (it
      # is a folder on /), and the action then fails computing a negative size
      # for it ("fallocate: invalid length value specified"). Only run it when
      # /mnt is its own filesystem; otherwise / alone has ~86 GB free.
      - name: Check for a separate /mnt disk
        id: disk
        run: |
          df -h / /mnt
          if [ "$(df --output=target /mnt | tail -1)" = "/mnt" ]; then
            echo "separate_mnt=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Maximize build space
        if: steps.disk.outputs.separate_mnt == 'true'
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 30720
          temp-reserve-mb: 30720
          swap-size-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: ${{ inputs.submodules}}
          token: ${{ secrets.GH_TOKEN }}
      - name: Install poetry
        run: pipx install poetry
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11
          cache: "poetry"
      - name: Install dependencies
        run: |
          cd ci
          poetry install
      - name: Run dagger pipeline
        run: |
          cd ci
          poetry run python main.py build direct ${{ inputs.extra-args }} --stage=${{ inputs.stage }}
