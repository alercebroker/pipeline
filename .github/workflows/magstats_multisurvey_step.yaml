name: Tests

on:
  pull_request:
    branches:
      - main
      - multisurvey
    paths:
      - "magstats_multisurvey_step/**"
      - "!magstats_multisurvey_step/README.md"

jobs:
  magstats_multisurvey_step_unittest:
    uses: ./.github/workflows/poetry-tests-template.yaml
    with:
      base-folder: "magstats_multisurvey_step"
      python-version: "3.10"
      sources-folder: "magstats_multisurvey_step"
      test-folder: "tests/unittests"
      codecov-flags: "magstats_multisurvey_step_unittest"
    secrets:
      GH_TOKEN: "${{ secrets.ADMIN_TOKEN }}"
      CODECOV_TOKEN: "${{ secrets.CODECOV_TOKEN }}"
