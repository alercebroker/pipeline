[tool.poetry]
name = "s3-step"
version = "27.6.0"
description = "S3 step"
authors = []
readme = "README.md"

[tool.poetry.dependencies]
python = "~3.9.0"
apf-base-ztf-legacy = { path = "../libs/apf_ztf_legacy", develop = true }
# Pin cfk to the librdkafka build that speaks SASL SCRAM-SHA-512 correctly; the
# transitive 2.1.x from apf_base hits the SCRAM bug against the quimal broker.
# Matches libs/apf's >=2.12 floor and the version watchlist_step runs on quimal.
confluent-kafka = "2.12.2"

[tool.poetry.group.dev.dependencies]
black = "^23.3.0"

[tool.poetry.group.test.dependencies]
pytest = "^7.3.1"
pytest-cov = "^4.1.0"
pytest-docker = "^1.0.1"
moto = {extras = ["secretsmanager"], version = "4.1.12"}

[tool.black]
line-length = 88

[tool.pytest.ini_options]
addopts = "-x"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
