[tool.poetry]
name = "hips-dummy-step"
version = "0.1.0"
description = "Throughput test: asks an image service for reference images of every alert's position"
authors = ["Ignacio Reyes-Jainaga"]
readme = "README.md"
packages = [{ include = "hips_dummy_step" }]

[tool.poetry.scripts]
step = { callable = "scripts.run_step:step" }

[tool.poetry.dependencies]
python = ">=3.10,<3.12"
apf-base = { path = "../libs/apf", develop = true }
numpy = ">=1.26.0,<2.0.0"
requests = "^2.31.0"

[tool.poetry.group.test.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
responses = "^0.25.0"

[tool.poetry.group.dev.dependencies]
black = "^25.1.0"

[tool.black]
line-length = 79

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
